name: Security Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to publish
        default: config-reloader-v0.75.2-p1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test config reloader
        run: go test ./cmd/config-reloader/...
      - name: Build Linux binaries
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 make build-config-reloader
            mkdir -p "security-build/linux-${arch}"
            cp bin/config-reloader "security-build/linux-${arch}/config-reloader"
          done
      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.multiarch \
            -t "ghcr.io/${{ github.repository_owner }}/operator:${{ inputs.image-tag }}" \
            --push .
